# ArtCraft — configuration
#
# This repository collects the latest WebAssembly ("web") build of every
# Crafting App published under https://github.com/storytold and publishes them
# as plain static web apps on GitHub Pages.
#
# Every `apps` entry needs at least:
#   name             Display name shown on the web entry page.
#   folder           Canonical folder name used under the cache and deploy
#                    folders. It follows the familiar software the app is a
#                    clean-room reimplementation of, e.g. `photoshop`.
#   baseurl          Public URL path the app is served from.
#   github-repo      Repository URL, used to query the GitHub releases API.
#   release-pattern  One regular expression per line, tried in order against the
#                    asset file names of the latest release. The first line is
#                    the preferred one; a matching group, if any, is used as the
#                    version number.
#   index            Entry file name inside the published bundle.
#   aliases          Short, memorable paths (`photo`, `ps`, `ai`, ...) that are
#                    served as a redirect to the canonical `baseurl`. Keep them
#                    lowercase and unique across the whole app list.

website:
  title: ArtCraft
  tagline: The Crafting Apps, in your browser
  description: >-
    WordCraft, DeckCraft, GridCraft, PhotoCraft, VectorCraft, FilmCraft,
    LightCraft, PdfCraft, EffectCraft, DesignCraft, FigCraft, CADCraft and
    SoundCraft — open-source creative tools written from scratch in pure Rust,
    compiled to WebAssembly and running entirely in your browser.
  url: https://Wu-Yijun.github.io/ArtCraft/
  baseurl: /ArtCraft/
  icon: https://getartcraft.com/artcraft-icon.svg

# Used by .github/workflows/deploy.yml to keep the cron in sync with config.yaml.
schedule:
  - cron: '56 4 * * *'

deploy:
  folder: deploy
  index: deploy/index.html
  app-list: deploy/apps.json

cache:
  folder: artcraft-apps/dist
  versions: artcraft-apps/dist/versions.yaml

download:
  folder: artcraft-apps/release

apps:
  - name: PhotoCraft
    title: Photoshop
    folder: photoshop
    aliases:
      - photo
      - pic
      - image
      - ps
    baseurl: /ArtCraft/photoshop/
    github-repo: https://github.com/storytold/photocraft
    home: https://getartcraft.com/apps/photocraft
    icon: https://getartcraft.com/images/apps/photocraft/icon.webp
    status: Early alpha
    description: The open-source image editor you already know how to use.
    release-pattern: |
      ^photocraft-web-(\d+\.\d+\.\d+)\.zip$
      ^photocraft-web-(.*)\.zip$
      ^\w+-web-(.*)\.zip$
      web\.(.*)\.zip
      web(.*)zip
    index: index.html

