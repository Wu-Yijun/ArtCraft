name: Download and Deploy ArtCraft Apps to Github Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: '23 22 * * *'
    - cron: '23 10 * * *'
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force redeploy even when no app was updated'
        required: false
        type: boolean

jobs:
  check-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      #### Set up environment ####
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'pnpm'

      - name: Set up PNPM
        run: pnpm ci

      - name: Load cached ArtCraft Apps
        uses: actions/cache/restore@v6
        with:
          path: artcraft-apps/dist
          key: artcraft-apps-${{ github.run_id }}
          restore-keys: artcraft-apps-

      - name: Load cached Deploy Hash
        uses: actions/cache/restore@v6
        with:
          path: artcraft-apps/deploy-hash.json
          key: deploy-hash-${{ github.run_id }}.json
          restore-keys: deploy-hash-

      #### Check for Updates, Download Missing files, Update cache files, and Copy to Deploy folder if needed ####
      - name: Run scripts
        id: updates
        run: node src/main.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_DEPLOY: ${{ github.event.inputs.force_deploy && '1' || '0' }}

      #### Cache ArtCraft Apps ####
      - name: Cache ArtCraft Apps
        if: steps.updates.outputs.cacheUpdated == 'true'
        uses: actions/cache/save@v6
        with:
          path: artcraft-apps/dist
          key: artcraft-apps-${{ github.run_id }}

      #### Deploy to GitHub Pages ####
      - name: Deploy to GitHub Pages
        if: steps.updates.outputs.deployUpdated == 'true'
        id: deployment
        uses: Wu-Yijun/actions/.github/actions/deploy@main
        with:
          path: deploy/
          expire: 30      # 30 seconds for max waiting before delete
      
      - name: Update Deploy Hash
        if: steps.updates.outputs.deployUpdated == 'true'
        uses: actions/cache/save@v6
        with:
          path: artcraft-apps/deploy-hash.json
          key: deploy-hash-${{ github.run_id }}.json
