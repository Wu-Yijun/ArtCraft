<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="ArtCraft — free online alternatives to Photoshop and other creative apps">
  <title>ArtCraft — free online creative apps</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="0.55" stop-color="#172b42"/>
      <stop offset="1" stop-color="#2b1831"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.12" cy="0.1" r="0.75">
      <stop offset="0" stop-color="#ff7a45" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff7a45" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb08a"/>
      <stop offset="1" stop-color="#ff7a45"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#glow)"/>
  <circle cx="1110" cy="-20" r="210" fill="#ff7a45" fill-opacity=".08"/>
  <path d="M0 304C210 260 342 350 560 302S950 250 1200 310V340H0Z" fill="#fff" fill-opacity=".035"/>
  <rect x="0.5" y="0.5" width="1199" height="339" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.14"/>

  <!-- mark -->
  <g transform="translate(72 66)">
    <path d="M0 26 L26 0 L52 26 L26 52 Z" fill="url(#mark)"/>
    <path d="M26 14 L38 26 L26 38 L14 26 Z" fill="#131826"/>
  </g>

  <!-- title -->
  <text x="72" y="182" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="62" font-weight="700" letter-spacing="-1.5" fill="#ffffff">Art<tspan fill="#ff7a45">Craft</tspan></text>
  <text x="74" y="216" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" fill="#d5dbea">Free online tools for images, video, design, PDF and more.</text>

  <!-- url -->
  <g transform="translate(72 238)">
    <rect width="322" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.16"/>
    <text x="18" y="23" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#ffb08a">wu-yijun.github.io/ArtCraft/</text>
  </g>

  <!-- apps -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="600" fill="#ffffff">
    <!-- image, illustration, photo and PDF -->
    <g transform="translate(716 64)"><rect width="60" height="60" rx="15" fill="#31a8ff" fill-opacity=".28" stroke="#31a8ff" stroke-opacity=".72"/><text x="30" y="37" text-anchor="middle">Ps</text></g>
    <g transform="translate(794 64)"><rect width="60" height="60" rx="15" fill="#ff9a00" fill-opacity=".28" stroke="#ff9a00" stroke-opacity=".72"/><text x="30" y="37" text-anchor="middle">Ai</text></g>
    <g transform="translate(872 64)"><rect width="60" height="60" rx="15" fill="#31a8ff" fill-opacity=".22" stroke="#31a8ff" stroke-opacity=".65"/><text x="30" y="37" text-anchor="middle">Lr</text></g>
    <g transform="translate(950 64)"><rect width="60" height="60" rx="15" fill="#ed1c24" fill-opacity=".25" stroke="#ed1c24" stroke-opacity=".68"/><text x="30" y="37" text-anchor="middle">Pdf</text></g>
    <g transform="translate(1028 64)"><rect width="60" height="60" rx="15" fill="#f24e1e" fill-opacity=".25" stroke="#f24e1e" stroke-opacity=".68"/><text x="30" y="37" text-anchor="middle">Fg</text></g>

    <!-- video, motion graphics, layout and presentations -->
    <g transform="translate(716 138)"><rect width="60" height="60" rx="15" fill="#9999ff" fill-opacity=".28" stroke="#9999ff" stroke-opacity=".72"/><text x="30" y="37" text-anchor="middle">Pr</text></g>
    <g transform="translate(794 138)"><rect width="60" height="60" rx="15" fill="#cf5cff" fill-opacity=".25" stroke="#cf5cff" stroke-opacity=".68"/><text x="30" y="37" text-anchor="middle">Ae</text></g>
    <g transform="translate(872 138)"><rect width="60" height="60" rx="15" fill="#ff3366" fill-opacity=".25" stroke="#ff3366" stroke-opacity=".68"/><text x="30" y="37" text-anchor="middle">Id</text></g>
    <g transform="translate(950 138)"><rect width="60" height="60" rx="15" fill="#f57827" fill-opacity=".28" stroke="#f57827" stroke-opacity=".72"/><text x="30" y="37" text-anchor="middle">Pp</text></g>
    <g transform="translate(1028 138)"><rect width="60" height="60" rx="15" fill="#22a366" fill-opacity=".25" stroke="#22a366" stroke-opacity=".68"/><text x="30" y="37" text-anchor="middle">Xl</text></g>

    <!-- documents, audio and CAD -->
    <g transform="translate(716 212)"><rect width="60" height="60" rx="15" fill="#2b579a" fill-opacity=".32" stroke="#5b9bd5" stroke-opacity=".72"/><text x="30" y="37" text-anchor="middle">Wd</text></g>
    <g transform="translate(794 212)"><rect width="60" height="60" rx="15" fill="#00a651" fill-opacity=".25" stroke="#00a651" stroke-opacity=".68"/><text x="30" y="37" text-anchor="middle">Au</text></g>
    <g transform="translate(872 212)"><rect width="60" height="60" rx="15" fill="#e83e2f" fill-opacity=".25" stroke="#e83e2f" stroke-opacity=".68"/><text x="30" y="37" text-anchor="middle">Cad</text></g>
  </g>
</svg>
