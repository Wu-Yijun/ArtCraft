  <circle cx="1110" cy="-20" r="210" fill="#ff7a45" fill-opacity=".08"/>
  <path d="M0 304C210 260 342 350 560 302S950 250 1200 310V340H0Z" fill="#fff" fill-opacity=".035"/>
  <rect x="0.5" y="0.5" width="1199" height="339" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.14"/>

